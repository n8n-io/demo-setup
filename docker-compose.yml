version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # It's highly recommended to set a strong encryption key in your .env file.
      # For production, ensure this key is securely managed.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Berlin
      # Example for database connection - ensure these are set in .env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - qdrant
    networks:
      - n8n_default_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Ollama exposes 11434 by default. Port mapping is useful for host access.
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      # Make Ollama listen on all interfaces within the container
      OLLAMA_HOST: 0.0.0.0
      # OLLAMA_MODELS: llama3:8b # Uncomment to pre-pull a model on startup
    # Profiles allow conditional service startup (e.g., for GPU vs. CPU)
    profiles:
      - gpu-nvidia
      - gpu-amd
      - cpu
    # Example for GPU support (uncomment and adjust for your specific setup)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - n8n_default_network

  barewire:
    image: ghcr.io/barewire/proxy:latest
    container_name: barewire
    restart: unless-stopped
    environment:
      # Barewire will proxy requests to the Ollama service within the Docker network
      BAREWIRE_UPSTREAM_URL: http://ollama:11434
      # Your Barewire API Key for advanced features like tenant identification,
      # analytics, and potentially cloud integrations. Get one from Barewire.
      BAREWIRE_API_KEY: ${BAREWIRE_API_KEY}
      # Uncomment for basic Barewire authentication if needed
      # BAREWIRE_API_KEY_HEADER: X-API-Key
      # Other Barewire configurations for features like rate limiting, compliance, etc.
    ports:
      # Expose Barewire proxy on host port 8080. N8N will connect to this port.
      - "8080:8080"
    depends_on:
      - ollama # Barewire needs Ollama to be running to proxy requests
    networks:
      - n8n_default_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # gRPC port
      - "6334:6334" # REST port
    volumes:
      - ./qdrant_data:/qdrant/data
    networks:
      - n8n_default_network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_default_network

networks:
  n8n_default_network:
    driver: bridge